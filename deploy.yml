---
- name: Local Server Deployment via Ansible
  hosts: prod
  become: true
  vars:
    docker_image: "sahy1234/collective1:latest"
    app_dir: "/home/yc/collective1-ansible"

  tasks:
    - name: Ensure community.docker collection is installed
      ansible.builtin.command:
        cmd: ansible-galaxy collection install community.docker
      changed_when: false
    - name: Ensure required system and Python dependencies are installed
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-setuptools
          - python3-docker
          - python3-requests
        state: present
        update_cache: yes
        
    - name: Ensure db.sqlite3 exists as a file (to avoid folder mount creation)
      file:
        path: "{{ app_dir }}/db.sqlite3"
        state: touch
        mode: "0666"
        modification_time: preserve
        access_time: preserve

    - name: Pull latest image from Docker Hub
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull
        force_source: true

    - name: Start and update Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: always

    - name: Run Django database migrations
      community.docker.docker_compose_v2_exec:
        project_src: "{{ app_dir }}"
        service: web
        command: python manage.py migrate --noinput
      register: migrate_output

    - name: Display migration results
      debug:
        var: migrate_output.stdout_lines

    - name: Prune old unused Docker images
      community.docker.docker_prune:
        images: true